onboarding = false

[keys]
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
open_worktree = "prefix+shift+o"
switch_tab = ""
switch_workspace = "prefix+1..9"

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "python3 ~/.config/herdr/pane-picker.py"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+w"
type = "popup"
command = "python3 ~/.config/herdr/pane-picker.py --workspaces"
width = "80%"
height = "60%"
